# Version catalog documentation
# https://docs.gradle.org/current/userguide/version_catalogs.html
# Specification of the TOML file format
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format
# Define a dependency
# We can equivalently write:
# - 'group = "androidx.compose", name = "compose-bom"'
# - 'module = "androidx.compose:compose-bom"'

[versions]
# buildScript dependencies
# https://kotlinlang.org/docs/releases.html#release-details
kotlin = "2.2.21"
# https://developer.android.com/studio/releases/gradle-plugin
androidBuildTools = "9.2.0"
# https://firebase.google.com/support/release-notes/androi
# Look for "google-services plugin"
googleServices="4.4.3"
# https://firebase.google.com/support/release-notes/android
# Look for "crashlytics gradle plugin"
firebaseCrashlyticsGradle="3.0.6"
# https://github.com/google/ksp/releases
# Independant from the Kotlin version since 2.3.0: https://github.com/google/ksp/releases/tag/2.3.0
# Compatible with AGP 9.0 since 2.3.1
ksp="2.3.4"
# https://developer.android.com/jetpack/androidx/releases/navigation
navigation="2.9.6"

# Others
# https://firebase.google.com/support/release-notes/android#latest_sdk_versions
firebase = "33.1.2"
material = "1.12.0"
# https://developer.android.com/reference/com/google/android/play/core/release-notes-in_app_reviews
review="2.0.1"
# https://github.com/google/ExoPlayer/blob/release-v2/RELEASENOTES.md
exoplayer="2.15.0"
# https://square.github.io/okhttp/changelogs/changelog/
okhttp="4.10.0"
# https://github.com/coil-kt/coil
coil="2.4.0"
# https://github.com/Kotlin/kotlinx.coroutines
coroutine="1.7.3"
# https://github.com/InsertKoinIO/koin/releases
koin="4.0.0"
# https://github.com/google/dagger/releases
dagger = "2.48.1"
# TODO
json = "20220320"
# TODO
konsist = "0.16.1"
# TODO
mockito = "5.3.1"
# TODO
hamcrest = "2.2"
# TODO
billing = "8.0.0"

# AndroidX
# https://developer.android.com/jetpack/androidx/releases/activity
androidx-activity = "1.10.1"
# https://developer.android.com/jetpack/androidx/releases/annotation
androidx-annotation="1.9.1"
# https://developer.android.com/jetpack/androidx/releases/appcompat
androidx-appcompat = "1.6.1"
# https://developer.android.com/jetpack/androidx/releases/cardview
androidx-cardview = "1.0.0"
# https://developer.android.com/jetpack/androidx/releases/constraintlayout
androidx-constraintlayout = "2.1.4"
# https://developer.android.com/jetpack/androidx/releases/core
androidx-core = "1.12.0"
# https://developer.android.com/jetpack/androidx/releases/fragment
androidx-fragment = "1.6.2"
# https://developer.android.com/jetpack/androidx/releases/lifecycle
androidx-lifecycle-runtime = "2.7.0"
# https://developer.android.com/jetpack/androidx/releases/lifecycle
androidx-lifecycle-viewmodel-compose = "2.7.0"
# https://developer.android.com/jetpack/androidx/releases/preference
androidx-preference = "1.2.1"
# https://developer.android.com/jetpack/androidx/releases/recyclerview
androidx-recyclerview = "1.3.2"
# https://developer.android.com/jetpack/androidx/releases/room
androidx-room = "2.6.1"
# https://developer.android.com/jetpack/androidx/releases/viewpager2
androidx-viewpager2 = "1.1.0"
# https://developer.android.com/jetpack/androidx/releases/datastore
android-datastore-preferences = "1.0.0"
#https://developer.android.com/jetpack/androidx/releases/profileinstaller
androidx-profileinstaller = "1.3.0-alpha02"
#https://developer.android.com/jetpack/androidx/releases/window
androidx-window = "1.3.0-beta02"

# Testing
testing-junit = "4.13.2"
testing-junit5 = "5.8.1"
# https://github.com/mockk/mockk/releases
testing-mockk = "1.13.2"
testing-androidx-junit = "1.1.5"
testing-espresso = "3.6.1"
testing-uiautomator = "2.2.0"
testing-benchmark = "1.2.0-alpha08"
testing-runner = "1.6.1"
testing-rules = "1.6.1"

[libraries]

# Google
billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
material = { module = "com.google.android.material:material", version.ref = "material"}
play-review = { module = "com.google.android.play:review-ktx", version.ref = "review"}

# Others
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
json = { module = "org.json:json", version.ref = "json" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
kotlinx-coroutine = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutine" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutine" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutine" }

# AndroidX
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity"}
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "androidx-cardview" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "androidx-preference" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
androidx-room-runtime = { module = "androidx.room:room-ktx", version.ref = "androidx-room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "androidx-viewpager2" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase"}
firebase-analytics = { module = "com.google.firebase:firebase-analytics-ktx" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics-ktx" }

# Testing
testing-junit = { module = "junit:junit", version.ref = "testing-junit"}
testing-androidx-junit = { module = "androidx.test.ext:junit", version.ref = "testing-androidx-junit"}
testing-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "testing-espresso"}
testing-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "testing-espresso"}
testing-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "testing-uiautomator"}
testing-benchmark = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "testing-benchmark"}
testing-androidx-room = { module = "androidx.room:room-testing", version.ref = "androidx-room" }
testing-androidx-rules = { module = "androidx.test:rules", version.ref = "testing-rules" }
testing-androidx-runner = { module = "androidx.test:runner", version.ref = "testing-runner" }
testing-hamcrest = { module = "org.hamcrest:hamcrest-library", version.ref = "hamcrest" }
testing-androidx-services = { module = "androidx.test.services:test-services", version = "1.4.2" }

# Convention plugin
android-gradle = { module = "com.android.tools.build:gradle", version.ref = "androidBuildTools" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "androidBuildTools"}
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref= "firebaseCrashlyticsGradle" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }